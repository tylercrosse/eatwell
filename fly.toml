# fly.toml app configuration file generated for calorie-tracker-dawn-thunder-2086 on 2026-05-31T18:59:14+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'calorie-tracker-dawn-thunder-2086'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'
  # Vite inlines this at build time, so it must be passed on every build. Keeping it here
  # means `fly deploy` always supplies it (no --build-arg needed). A Google OAuth client id
  # is public (it ships in the JS bundle), so it's safe to commit.
  [build.args]
    VITE_GOOGLE_CLIENT_ID = '1061368975039-gscug66af6koc7ovvkjdd6l4cam7eusa.apps.googleusercontent.com'

[env]
  CORS_ORIGINS = 'https://calorie-tracker-dawn-thunder-2086.fly.dev'
  # Absolute origin magic links point at. Must be set: links are built from this and never
  # from the request Host header, which an attacker could spoof to harvest sign-in tokens.
  APP_BASE_URL = 'https://calorie-tracker-dawn-thunder-2086.fly.dev'
  # Behind Fly's proxy, request.client.host is the proxy — without this every caller shares
  # one address and the per-IP sign-in rate limit locks out everyone at once.
  TRUSTED_CLIENT_IP_HEADER = 'fly-client-ip'
  # Switch to 'smtp' once SMTP_* secrets are set (see README). 'console' only logs the link.
  EMAIL_PROVIDER = 'console'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
